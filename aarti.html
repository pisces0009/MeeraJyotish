<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>आरती संग्रह</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

    :root {
        --primary-glow-color: rgba(0, 255, 255, 0.7);
        --secondary-glow-color: rgba(255, 0, 255, 0.7);
        --card-bg-color: rgba(22, 22, 32, 0.6);
        --border-color: rgba(255, 255, 255, 0.18);
    }

    body {
      background-image: url('./images/indexbackground.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      margin: 0;
      font-family: 'Poppins', sans-serif;
      color: #ffffff;
    }

    .top-header {
      position: relative;
      top: 0;
      left: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
      font-size: 2.2em;
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      box-shadow: 0 4px rgb(0, 0, 0, 0.1);
      animation: glow 1s ease-in-out infinite alternate;
      box-sizing: border-box;
      text-shadow: 0 0 10px var(--primary-glow-color), 0 0 20px var(--secondary-glow-color);
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px var(--primary-glow-color), 0 0 20px var(--secondary-glow-color); }
      to   { text-shadow: 0 0 20px var(--primary-glow-color), 0 0 30px var(--secondary-glow-color); }
    }

    /* Burger icon (click -> Home) */
    .burger-menu {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
    }
    .burger-menu .burger-icon {
      width: 40px;
      height: 40px;
      cursor: pointer;
    }

    /* Revealed link */
    .aarti-link {
      display: none;
      text-align: center;
      font-weight: 600;
      font-size: 1.1em;
      margin-top: 15px;
      color: var(--primary-glow-color);
      text-decoration: underline;
      cursor: pointer;
    }
    .aarti-link:hover { text-shadow: 0 0 8px var(--primary-glow-color); }

    /* Highlighted lyrics panel */
    .lyrics-panel {
      display: block;
      max-width: 760px;
      margin: 16px auto 24px;
      padding: 25px 30px;
      border-radius: 15px;
      background: var(--card-bg-color);
      color: #ffffff;
      border: 1px solid var(--border-color);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    .lyrics-panel[hidden] { display: none; }
    .lyrics-title { 
      margin: 0 0 15px; 
      text-align: center; 
      font-size: 1.8em;
      font-weight: 600;
      color: var(--primary-glow-color);
    }
    .ly { margin: 6px 0; line-height: 1.8; font-size: 1.1em; }

    /* Bell toolbar inside highlighted panel */
    .panel-toolbar {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 15px;
    margin: 8px 0 20px;
    padding-bottom: 15px;
    border-bottom: 1px solid var(--border-color);
  }
  .bell-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--border-color);
    background: rgba(255, 255, 255, 0.1); cursor: pointer;
    transition: background 0.3s, box-shadow 0.3s;
  }
  .bell-btn:hover { 
    background: rgba(255, 255, 255, 0.2);
    box-shadow: 0 0 15px var(--primary-glow-color);
  }
  .bell-btn.active { 
    background: var(--primary-glow-color); 
    box-shadow: 0 0 15px var(--primary-glow-color); 
  }
  .bell-btn img { width: 22px; height: 22px; pointer-events: none; }

  /* Put Ganesh and Hanuman icons in one row */
  .icon-row {
      display: flex;
      gap: 20px;
      justify-content: center;
      align-items: flex-start; /* Aligns items at the top */
      margin: 40px auto 16px;
      max-width: 520px;
      padding: 20px;
    }
    .icon-card { 
      text-align: center; 
      cursor: pointer;
      transition: transform 0.3s ease;
    }
    .icon-card:hover {
      transform: scale(1.1);
    }
    .icon-card .circle-image {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 10px;
      border: 2px solid var(--border-color);
      background: rgba(255, 255, 255, 0.1);
      transition: box-shadow 0.3s ease;
    }
    .icon-card:hover .circle-image {
      box-shadow: 0 0 20px var(--primary-glow-color);
    }
    .icon-row .circle-caption { margin-top: 4px; font-weight: 600; }
   
  </style>
</head>
<body id="main-body">
  <h1 class="top-header">आरती संग्रह</h1>

  <!-- Burger Menu (click -> Home) -->
  <div class="burger-menu">
    <img src="./images/burger-icon.png"
         alt="Menu"
         class="burger-icon"
         onclick="window.location.href='index.html'">
  </div>

   <!-- Circle icons row -->
  <div class="icon-row">
    <div class="icon-card">
      <img id="ganesh-icon" src="./images/1icon.webp" alt="Aarti Icon" class="circle-image">
      <p id="ganesh-caption" class="circle-caption" role="button" tabindex="0" aria-controls="aarti-item-1">श्री गणेश आरती</p>
    </div>
    <div class="icon-card">
      <img id="hanuman-icon" src="./images/hanuman.png" alt="Hanuman Icon" class="circle-image" onclick="window.location.href='./AARTI/hanuman.html'">
      <p id="hanuman-caption" class="circle-caption" role="button" tabindex="0">श्री हनुमान आरती</p>
    </div>
  </div>
 
   <!-- Hidden clickable text -->
  <a id="aarti-item-1" class="aarti-link" href="#">
    1. सुखकर्ता दुःखहर्ता
  </a>

  <!-- Highlighted lyrics container -->
  <div id="lyrics-panel" class="lyrics-panel" role="region" aria-labelledby="aarti-item-1" hidden></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const link = document.getElementById('aarti-item-1');
      const panel = document.getElementById('lyrics-panel');
      // Use Ganesh icon/caption for the current interactions
      const img = document.getElementById('ganesh-icon');
      const caption = document.getElementById('ganesh-caption');
  
      let isLinkVisible = false;
      const reveal = () => { link.style.display = 'block'; isLinkVisible = true; };
      const hideLink = () => { link.style.display = 'none'; isLinkVisible = false; };
  
      // Bell and Music audio state (reused across renders)
      let bellAudio = null, isBellOn = false;
      let musicAudio = null, isMusicOn = false;
      let isPanelOpen = false;
  
      function hideLyricsPanel() {
        if (!panel.hidden) {
          if (bellAudio) { bellAudio.pause(); bellAudio.currentTime = 0; }
          if (musicAudio) { musicAudio.pause(); musicAudio.currentTime = 0; }
          isBellOn = false;
          isMusicOn = false;
          panel.hidden = true;
          isPanelOpen = false;
          hideLink();
          caption.focus();
          img.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }
  
      function showGaneshAarti() {
        const lines = [
          "सुखकर्ता दुःखहर्ता, वार्ता विघ्नांची|",
          "नुरवी पुरवी प्रेम, कृपा जयाची||",
          "सर्वांगी सुंदर, उटी शेंदुराची|",
          "कंठि झळके माळ, मुक्ताफळांची||",
          "जय देव जय देव, जय मंगलमूर्ती|",
          "दर्शनमात्रे मन कामना पुरती||",
          "रत्नखचित फरा, तुज गौरीकुमरा|",
          "चंदनाची उटी, कुमकुम केशरा||",
          "हिरेजडित मुकुट, शोभतो बरा|",
          "रुणझुणती नूपुरे, चरणी घागरिया||",
          "जय देव जय देव, जय मंगलमूर्ती|",
          "दर्शनमात्रे मन कामना पुरती||",
          "लंबोदर पीतांबर, फणिवरबंधना|",
          "सरळ सोंड, वक्रतुंड त्रिनयना||",
          "सर्वांगी सुंदर, उटी शेंदुराची|",
          "कंठि झळके माळ, मुक्ताफळांची||",
          "जय देव जय देव, जय मंगलमूर्ती|",
          "दर्शनमात्रे मन कामना पुरती||"
        ];
        panel.innerHTML = `
            <h2 class="lyrics-title">सुखकर्ता दुःखहर्ता</h2>
            <div class="panel-toolbar">
            <button id="bell-toggle" class="bell-btn" aria-pressed="false" aria-label="घंटा वाजवा">
                <img src="./images/bell.png" alt="Bell">
            </button>
            <button id="music-toggle" class="bell-btn" aria-pressed="false" aria-label="आरती प्ले करा">
                <img src="./images/music-1.jpg" alt="Music">
            </button>
            </div>
        ${lines.map(l => `<div class="ly">${l}</div>`).join('')}
        `;
        panel.hidden = false;
        isPanelOpen = true;
        panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  
        // Bell setup (loops until turned off)
        const bellBtn = panel.querySelector('#bell-toggle');
        if (!bellAudio) {
          bellAudio = new Audio('./sound/bell-1.mp3');
          bellAudio.loop = true;
        }
        if (isBellOn) {
          bellBtn.classList.add('active');
          bellBtn.setAttribute('aria-pressed', 'true');
        }
        bellBtn.addEventListener('click', async () => {
          try {
            if (!isBellOn) {
              await bellAudio.play();
              isBellOn = true;
              bellBtn.classList.add('active');
              bellBtn.setAttribute('aria-pressed', 'true');
            } else {
              bellAudio.pause();
              bellAudio.currentTime = 0;
              isBellOn = false;
              bellBtn.classList.remove('active');
              bellBtn.setAttribute('aria-pressed', 'false');
            }
          } catch (err) { console.error('Bell play failed:', err); }
        });
  
        // Music setup (plays/pauses aarti track)
        const musicBtn = panel.querySelector('#music-toggle');
        if (!musicAudio) {
          musicAudio = new Audio('./sound/Sukhkarta.mp3');
          // musicAudio.loop = false; // enable if you want it to repeat
        }
        if (isMusicOn) {
          musicBtn.classList.add('active');
          musicBtn.setAttribute('aria-pressed', 'true');
        }
        musicBtn.addEventListener('click', async () => {
          try {
            if (!isMusicOn) {
              await musicAudio.play();
              isMusicOn = true;
              musicBtn.classList.add('active');
              musicBtn.setAttribute('aria-pressed', 'true');
            } else {
              musicAudio.pause();
              musicAudio.currentTime = 0;
              isMusicOn = false;
              musicBtn.classList.remove('active');
              musicBtn.setAttribute('aria-pressed', 'false');
            }
          } catch (err) { console.error('Music play failed:', err); }
        });
  
        // Ensure audio stops on unload
        window.addEventListener('beforeunload', () => {
          if (bellAudio) bellAudio.pause();
          if (musicAudio) musicAudio.pause();
        }, { once: true });
      }
  
      // Circle icon/caption toggle logic (unchanged)
      img.addEventListener('click', () => {
        if (isPanelOpen) hideLyricsPanel();
        else if (isLinkVisible) hideLink();
        else reveal();
      });
      img.setAttribute('tabindex', '0');
      img.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          if (isPanelOpen) hideLyricsPanel();
          else if (isLinkVisible) hideLink();
          else reveal();
        }
      });
      caption.addEventListener('click', () => {
        if (isPanelOpen) hideLyricsPanel();
        else if (isLinkVisible) hideLink();
        else reveal();
      });
      caption.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          if (isPanelOpen) hideLyricsPanel();
          else if (isLinkVisible) hideLink();
          else reveal();
        }
      });
  
      link.addEventListener('click', (e) => {
        e.preventDefault();
        showGaneshAarti();
      });
  
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && isPanelOpen) hideLyricsPanel();
      });
    });
  </script>
</body>
</html>
