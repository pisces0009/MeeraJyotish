<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>आरती संग्रह</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

    :root {
        --primary-glow-color: rgba(0, 255, 255, 0.7);
        --secondary-glow-color: rgba(255, 0, 255, 0.7);
        --card-bg-color: rgba(22, 22, 32, 0.6);
        --border-color: rgba(255, 255, 255, 0.18);
    }

    body {
      background-image: url('./images/indexbackground.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      margin: 0;
      font-family: 'Poppins', sans-serif;
      color: #ffffff;
    }

    .top-header {
      position: relative;
      top: 0;
      left: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
      font-size: 2.2em;
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      box-shadow: 0 4px rgb(0, 0, 0, 0.1);
      animation: glow 1s ease-in-out infinite alternate;
      box-sizing: border-box;
      text-shadow: 0 0 10px var(--primary-glow-color), 0 0 20px var(--secondary-glow-color);
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px var(--primary-glow-color), 0 0 20px var(--secondary-glow-color); }
      to   { text-shadow: 0 0 20px var(--primary-glow-color), 0 0 30px var(--secondary-glow-color); }
    }

    .burger-menu {
      position: absolute;
      top: 25px;
      left: 25px;
      z-index: 1000;
      cursor: pointer;
    }
    .burger-icon {
      width: 30px;
      height: 22px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .burger-icon span {
      display: block;
      width: 100%;
      height: 3px;
      background-color: #ffffff;
      border-radius: 3px;
      transition: all 0.3s ease-in-out;
    }
    .burger-menu:hover .burger-icon span:nth-child(1) {
      transform: translateY(9.5px) rotate(45deg);
    }
    .burger-menu:hover .burger-icon span:nth-child(2) {
      opacity: 0;
    }
    .burger-menu:hover .burger-icon span:nth-child(3) {
      transform: translateY(-9.5px) rotate(-45deg);
    }

    /* Revealed link */
    .aarti-link {
      display: none;
      text-align: center;
      font-weight: 600;
      font-size: 1.1em;
      margin-top: 15px;
      color: var(--primary-glow-color);
      text-decoration: underline;
      cursor: pointer;
    }
    .aarti-link:hover { text-shadow: 0 0 8px var(--primary-glow-color); }

    /* Highlighted lyrics panel */
    .lyrics-panel {
      display: block;
      max-width: 760px;
      margin: 16px auto 24px;
      padding: 25px 30px;
      border-radius: 15px;
      background: var(--card-bg-color);
      color: #ffffff;
      border: 1px solid var(--border-color);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    .lyrics-panel[hidden] { display: none; }
    .lyrics-title { 
      margin: 0 0 15px; 
      text-align: center; 
      font-size: 1.8em;
      font-weight: 600;
      color: var(--primary-glow-color);
    }
    .ly { margin: 6px 0; line-height: 1.8; font-size: 1.1em; }

    /* Bell toolbar inside highlighted panel */
    .panel-toolbar {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 15px;
    margin: 8px 0 20px;
    padding-bottom: 15px;
    border-bottom: 1px solid var(--border-color);
  }
  .bell-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--border-color);
    background: rgba(255, 255, 255, 0.1); cursor: pointer;
    transition: background 0.3s, box-shadow 0.3s;
  }
  .bell-btn:hover { 
    background: rgba(255, 255, 255, 0.2);
    box-shadow: 0 0 15px var(--primary-glow-color);
  }
  .bell-btn.active { 
    background: var(--primary-glow-color); 
    box-shadow: 0 0 15px var(--primary-glow-color); 
  }
  .bell-btn img { width: 22px; height: 22px; pointer-events: none; }

  /* Put Ganesh and Hanuman icons in one row */
  .icon-row {
      display: flex;
      gap: 20px;
      justify-content: center;
      align-items: flex-start; /* Aligns items at the top */
      margin: 40px auto 16px;
      max-width: 520px;
      padding: 20px;
    }
    .icon-card { 
      text-align: center; 
      cursor: pointer;
      transition: transform 0.3s ease;
    }
    .icon-card:hover {
      transform: scale(1.1);
    }
    .icon-card .circle-image {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 10px;
      border: 2px solid var(--border-color);
      background: rgba(255, 255, 255, 0.1);
      transition: box-shadow 0.3s ease;
    }
    .icon-card:hover .circle-image {
      box-shadow: 0 0 20px var(--primary-glow-color);
    }
    .icon-row .circle-caption { margin-top: 4px; font-weight: 600; }
   
  </style>
</head>
<body id="main-body">
  <h1 class="top-header">आरती संग्रह</h1>

  <div class="burger-menu" onclick="window.location.href='index.html'" role="button" aria-label="Go to homepage">
    <div class="burger-icon">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>

   <!-- Circle icons row -->
  <div class="icon-row">
    <div class="icon-card">
      <img id="ganesh-icon" src="./images/1icon.webp" alt="Aarti Icon" class="circle-image">
      <p id="ganesh-caption" class="circle-caption" role="button" tabindex="0" aria-controls="aarti-item-1">श्री गणेश आरती</p>
    </div>
    <div class="icon-card">
      <img id="hanuman-icon" src="./images/hanuman.png" alt="Hanuman Icon" class="circle-image">
      <p id="hanuman-caption" class="circle-caption" role="button" tabindex="0" aria-controls="aarti-item-2">श्री हनुमान आरती</p>
    </div>
  </div>
 
   <!-- Hidden clickable text -->
  <a id="aarti-item-1" class="aarti-link" href="#">
    1. सुखकर्ता दुःखहर्ता
  </a>

  <a id="aarti-item-2" class="aarti-link" href="#">
    2. आरती कीजै हनुमान लला की
  </a>

  <!-- Highlighted lyrics container -->
  <div id="lyrics-panel" class="lyrics-panel" role="region" aria-labelledby="aarti-item-1" hidden></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const link = document.getElementById('aarti-item-1');
      const panel = document.getElementById('lyrics-panel');
      
      const ganeshIcon = document.getElementById('ganesh-icon');
      const ganeshCaption = document.getElementById('ganesh-caption');
      const ganeshLink = document.getElementById('aarti-item-1');

      const hanumanIcon = document.getElementById('hanuman-icon');
      const hanumanCaption = document.getElementById('hanuman-caption');
      const hanumanLink = document.getElementById('aarti-item-2');
  
      let activeLink = null;
      const revealLink = (linkElement) => { linkElement.style.display = 'block'; activeLink = linkElement; };
      const hideActiveLink = () => { if (activeLink) { activeLink.style.display = 'none'; activeLink = null; } };
  
      // Bell and Music audio state (reused across renders)
      let bellAudio = null, isBellOn = false;
      let musicAudio = null, isMusicOn = false;
      let isPanelOpen = false;
  
      function hideLyricsPanel() {
        if (!panel.hidden) {
          if (bellAudio) { bellAudio.pause(); bellAudio.currentTime = 0; }
          if (musicAudio) { musicAudio.pause(); musicAudio.currentTime = 0; }
          isBellOn = false;
          isMusicOn = false;
          panel.hidden = true;
          isPanelOpen = false;
          hideActiveLink();
          // Focus logic can be improved if needed, for now, just hide
          // ganeshCaption.focus(); 
        }
      }
  
      function showGaneshAarti() {
        const lines = [
          "सुखकर्ता दुःखहर्ता, वार्ता विघ्नांची|",
          "नुरवी पुरवी प्रेम, कृपा जयाची||",
          "सर्वांगी सुंदर, उटी शेंदुराची|",
          "कंठि झळके माळ, मुक्ताफळांची||",
          "जय देव जय देव, जय मंगलमूर्ती|",
          "दर्शनमात्रे मन कामना पुरती||",
          "रत्नखचित फरा, तुज गौरीकुमरा|",
          "चंदनाची उटी, कुमकुम केशरा||",
          "हिरेजडित मुकुट, शोभतो बरा|",
          "रुणझुणती नूपुरे, चरणी घागरिया||",
          "जय देव जय देव, जय मंगलमूर्ती|",
          "दर्शनमात्रे मन कामना पुरती||",
          "लंबोदर पीतांबर, फणिवरबंधना|",
          "सरळ सोंड, वक्रतुंड त्रिनयना||",
          "सर्वांगी सुंदर, उटी शेंदुराची|",
          "कंठि झळके माळ, मुक्ताफळांची||",
          "जय देव जय देव, जय मंगलमूर्ती|",
          "दर्शनमात्रे मन कामना पुरती||"
        ];
        panel.innerHTML = `
            <h2 class="lyrics-title">सुखकर्ता दुःखहर्ता</h2>
            <div class="panel-toolbar">
            <button id="bell-toggle" class="bell-btn" aria-pressed="false" aria-label="घंटा वाजवा">
                <img src="./images/bell.png" alt="Bell">
            </button>
            <button id="music-toggle" class="bell-btn" aria-pressed="false" aria-label="आरती प्ले करा">
                <img src="./images/music-1.jpg" alt="Music">
            </button>
            </div>
        ${lines.map(l => `<div class="ly">${l}</div>`).join('')}
        `;
        panel.hidden = false;
        isPanelOpen = true;
        panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  
        // Bell setup (loops until turned off)
        const bellBtn = panel.querySelector('#bell-toggle');
        if (!bellAudio) {
          bellAudio = new Audio('./sound/bell-1.mp3');
          bellAudio.loop = true;
        }
        if (isBellOn) {
          bellBtn.classList.add('active');
          bellBtn.setAttribute('aria-pressed', 'true');
        }
        bellBtn.addEventListener('click', async () => {
          try {
            if (!isBellOn) {
              await bellAudio.play();
              isBellOn = true;
              bellBtn.classList.add('active');
              bellBtn.setAttribute('aria-pressed', 'true');
            } else {
              bellAudio.pause();
              bellAudio.currentTime = 0;
              isBellOn = false;
              bellBtn.classList.remove('active');
              bellBtn.setAttribute('aria-pressed', 'false');
            }
          } catch (err) { console.error('Bell play failed:', err); }
        });
  
        // Music setup (plays/pauses aarti track)
        const musicBtn = panel.querySelector('#music-toggle');
        if (!musicAudio) {
          musicAudio = new Audio('./sound/Sukhkarta.mp3');
          // musicAudio.loop = false; // enable if you want it to repeat
        }
        if (isMusicOn) {
          musicBtn.classList.add('active');
          musicBtn.setAttribute('aria-pressed', 'true');
        }
        musicBtn.addEventListener('click', async () => {
          try {
            if (!isMusicOn) {
              await musicAudio.play();
              isMusicOn = true;
              musicBtn.classList.add('active');
              musicBtn.setAttribute('aria-pressed', 'true');
            } else {
              musicAudio.pause();
              musicAudio.currentTime = 0;
              isMusicOn = false;
              musicBtn.classList.remove('active');
              musicBtn.setAttribute('aria-pressed', 'false');
            }
          } catch (err) { console.error('Music play failed:', err); }
        });
  
        // Ensure audio stops on unload
        window.addEventListener('beforeunload', () => {
          if (bellAudio) bellAudio.pause();
          if (musicAudio) musicAudio.pause();
        }, { once: true });
      }
  
      function showHanumanAarti() {
        const lines = [
          "आरती कीजै हनुमान लला की।",
          "दुष्ट दलन रघुनाथ कला की॥",
          "जाके बल से गिरिवर कांपे।",
          "रोग दोष जाके निकट न झांपे॥",
          "अंजनि पुत्र महा बलदाई।",
          "संतन के प्रभु सदा सहाई॥",
          "दे बीरा रघुनाथ पठाए।",
          "लंका जारि सिया सुधि लाए॥",
          "लंका सो कोट समुद्र सी खाई।",
          "जात पवनसुत बार न लाई॥",
          "लंका जारि असुर संहारे।",
          "सियारामजी के काज संवारे॥",
          "लक्ष्मण मूर्छित पड़े सकारे।",
          "आनि संजीवन प्रान उबारे॥",
          "पैठि पताल तोरि जम-कारे।",
          "अहिरावन की भुजा उखारे॥",
          "बाएं भुजा असुर दल मारे।",
          "दाहिने भुजा संतजन तारे॥",
          "सुर नर मुनि आरती उतारें।",
          "जय जय जय हनुमान उचारें॥",
          "कंचन थार कपूर लौ छाई।",
          "आरती करत अंजना माई॥",
          "जो हनुमानजी की आरती गावे।",
          "बसि बैकुंठ परम पद पावे॥"
        ];
        panel.innerHTML = `
            <h2 class="lyrics-title">श्री हनुमान आरती</h2>
            <div class="panel-toolbar">
            <button id="bell-toggle" class="bell-btn" aria-pressed="false" aria-label="घंटा वाजवा">
                <img src="./images/bell.png" alt="Bell">
            </button>
            <button id="music-toggle" class="bell-btn" aria-pressed="false" aria-label="आरती प्ले करा">
                <img src="./images/music-1.jpg" alt="Music">
            </button>
            </div>
        ${lines.map(l => `<div class="ly">${l}</div>`).join('')}
        `;
        panel.hidden = false;
        isPanelOpen = true;
        panel.scrollIntoView({ behavior: 'smooth', block: 'start' });

        const bellBtn = panel.querySelector('#bell-toggle');
        if (!bellAudio) { bellAudio = new Audio('./sound/bell-1.mp3'); bellAudio.loop = true; }
        if (isBellOn) { bellBtn.classList.add('active'); bellBtn.setAttribute('aria-pressed', 'true'); }
        bellBtn.addEventListener('click', async () => {
            try {
                if (!isBellOn) { await bellAudio.play(); isBellOn = true; bellBtn.classList.add('active'); bellBtn.setAttribute('aria-pressed', 'true'); }
                else { bellAudio.pause(); bellAudio.currentTime = 0; isBellOn = false; bellBtn.classList.remove('active'); bellBtn.setAttribute('aria-pressed', 'false'); }
            } catch (err) { console.error('Bell play failed:', err); }
        });

        const musicBtn = panel.querySelector('#music-toggle');
        musicAudio = new Audio('./sound/hanuman.mp3'); // Use Hanuman audio
        if (isMusicOn) { musicBtn.classList.add('active'); musicBtn.setAttribute('aria-pressed', 'true'); }
        musicBtn.addEventListener('click', async () => {
            try {
                if (!isMusicOn) { await musicAudio.play(); isMusicOn = true; musicBtn.classList.add('active'); musicBtn.setAttribute('aria-pressed', 'true'); }
                else { musicAudio.pause(); musicAudio.currentTime = 0; isMusicOn = false; musicBtn.classList.remove('active'); musicBtn.setAttribute('aria-pressed', 'false'); }
            } catch (err) { console.error('Music play failed:', err); }
        });

        window.addEventListener('beforeunload', () => {
          if (bellAudio) bellAudio.pause();
          if (musicAudio) musicAudio.pause();
        }, { once: true });
      }

      // --- Setup Icons ---
      function setupIcon(icon, caption, link) {
        const reveal = () => {
          hideActiveLink(); // Hide any other visible link first
          revealLink(link);
        };
        const hideLink = () => hideActiveLink();

        const clickHandler = () => {
          if (isPanelOpen) hideLyricsPanel();
          else if (activeLink === link) hideLink();
          else reveal();
        };

        const keyHandler = (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            clickHandler();
          }
        };

        icon.addEventListener('click', clickHandler);
        icon.addEventListener('keydown', keyHandler);
        caption.addEventListener('click', clickHandler);
        caption.addEventListener('keydown', keyHandler);
      }
      
      setupIcon(ganeshIcon, ganeshCaption, ganeshLink);
      setupIcon(hanumanIcon, hanumanCaption, hanumanLink);

      ganeshLink.addEventListener('click', (e) => {
        e.preventDefault();
        showGaneshAarti();
      });
      
      hanumanLink.addEventListener('click', (e) => {
        e.preventDefault();
        showHanumanAarti();
      });
  
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && isPanelOpen) hideLyricsPanel();
      });
    });
  </script>
</body>
</html>
