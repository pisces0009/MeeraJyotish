<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meera Jyotish</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

        body {
            background-image: url('./images/indexbackground.jpg'); /* Modern, abstract background */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
        }

        .container {
            width: 90%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            padding: 30px;
            text-align: center;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .top-header {
            font-size: 2.2em;
            font-weight: 600;
            margin-bottom: 30px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .button-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }

        .button {
            text-align: center;
            transition: transform 0.3s ease;
        }

        .button:hover {
            transform: scale(1.1);
        }
        
        .button a {
            text-decoration: none;
            color: #ffffff;
        }

        .button img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 5px;
            transition: box-shadow 0.3s ease;
        }
        
        .button a:hover img {
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
        }

        .button p {
            margin-top: 10px;
            font-size: 1em;
            font-weight: 400;
        }

        .additional-text {
            text-align: center;
            font-size: 1em;
        }
        
        .additional-text p {
            margin: 5px 0;
        }
        
        .additional-text .acharya-name {
            font-size: 1.3em;
            font-weight: 600;
        }

        .circle-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.3);
            margin: 15px auto;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            .top-header {
                font-size: 1.8em;
            }
            .button-container {
                gap: 15px;
            }
            .button img {
                width: 60px;
                height: 60px;
            }
            .circle-image {
                width: 100px;
                height: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="top-header">
            || वेदांग ज्योतिष केंद्र ||  
        </h1>

        <div class="button-container">
            <div class="button">
                <a href="panchang.html">
                    <img src="./images/1icon.webp" alt="Daily Panchang Details">
                    <p><strong>दैनिक पंचांग</strong></p>
                </a>
            </div>
            <div class="button">
                <a href="RashiBhavishya.html">
                    <img src="./images/2icon.png" alt="Daily Rashi Bhavishya">
                    <p><strong>दैनिक राशी भविष्य</strong></p>
                </a>
            </div>
            <div class="button">
                <a href="aarti.html">
                    <img src="./images/aarti.png" alt="Aarti Collection">
                    <p><strong>आरती संग्रह</strong></p>
                </a>
            </div>
            <div class="button">
                <a href="shop.html">
                    <img src="./images/rashiRatna.png" alt="Gemstones">
                    <p><strong>राशी रत्न</strong></p>
                </a>
            </div>  
        </div>

        <div class="additional-text">
            <p><strong>ज्योतिषाचार्य</strong></p>
            <img src="images/aai1.png" alt="Dr. Sau. Meera B. Kale" class="circle-image">
            <p class="acharya-name">डॉ सौ.मीरा.बी.काळे</p>
            <p>Mob: +91 9371998641</p>
        </div>
    </div>
</body>
<script>
    function toggleMenu() {
        const menu = document.getElementById('menu');
        if (menu.style.display === 'block') {
            menu.style.display = 'none';
        } else {
            menu.style.display = 'block';
        }
    }
</script>
</html>
